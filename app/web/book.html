<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>線上預約・估價｜店家營運中樞（示範）</title>
<link rel="icon" href="/brand-favicon-64.png">
<link rel="stylesheet" href="/style.css?v=20261026a">
<style>
.svc{display:flex;gap:12px;align-items:center;border:1px solid #e5e5ea;border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}
.svc.on{border-color:#0b7a5c;box-shadow:0 0 0 2px rgba(11,122,92,.15)}
.svc .t{flex:1;min-width:0}.svc .n{font-weight:700}.svc .m{font-size:13px;color:#6e6e73}
.svc .p{font-weight:700;white-space:nowrap}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #c7c7cc;background:#fff;font-size:18px;line-height:1;cursor:pointer}
.qty b{min-width:20px;text-align:center}
.estrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.estrow.total{font-weight:700;font-size:18px;border-top:1px solid #e5e5ea;margin-top:6px;padding-top:8px}
#err:not(:empty){position:fixed;left:12px;right:12px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:60;margin:0;padding:14px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:16px;background:#FFF1F0;color:#B3261E;border:1px solid #F3B4AE}
@media (max-width:520px){.svc{flex-wrap:wrap}.svc .t{flex:1 1 100%}.svc .p{flex:1}}
@media (prefers-color-scheme: dark){.svc{background:#1c1c1e;border-color:#3a3a3c;color:#f2f2f7}.svc .m{color:#a1a1a6}.qty button{background:#2c2c2e;color:#f2f2f7;border-color:#48484a}}
</style>
</head>
<body style="padding-bottom:40px">
<main class="main" style="max-width:680px">
  <h1 class="headline">線上預約・估價</h1>
  <p class="sub">選服務項目和數量、挑日期時段、留下地址就完成。系統先依單價試算，店家確認後再把正式報價單傳給您。</p>
  <form id="bk" class="card" novalidate>
    <h3 style="margin-top:0">1. 選服務項目（可複選、可調數量）</h3>
    <div id="svcs"></div>
    <h3 style="margin-top:26px">2. 希望的日期與時段</h3>
    <div class="g2"><div><label for="date">日期</label><input id="date" type="date"></div>
      <div><label for="slot">時段</label><select id="slot"></select></div></div>
    <h3 style="margin-top:26px">3. 服務地點</h3>
    <div class="g2"><div><label for="county">縣市</label><select id="county"></select></div><div><label for="area">區</label><select id="area"></select></div></div>
    <label for="address">地址（到府服務填服務地址；到店服務可填「到店」）</label><input id="address" placeholder="例：○○路 1 號 5 樓" autocomplete="street-address">
    <h3 style="margin-top:26px">4. 聯絡方式</h3>
    <div class="g2"><div><label for="name">稱呼</label><input id="name" placeholder="例：王先生" autocomplete="name"></div>
      <div><label for="phone">手機</label><input id="phone" inputmode="tel" placeholder="例：0912-345-678" autocomplete="tel"></div></div>
    <label for="notes">想先交代的（選填：需求說明、指定人員、停車方式…）</label><textarea id="notes" rows="3"></textarea>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><label for="website">網站</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <div id="est" class="estbox" hidden></div>
    <label class="chk" style="margin-top:18px"><input type="checkbox" id="agree"> 同意店家為安排服務使用以上資料（不會提供給第三方）</label>
    <button class="btn full" style="margin-top:20px" type="submit" id="go">送出預約</button>
    <div id="err" class="err" role="alert"></div>
  </form>
  <div id="ok" class="card" hidden><h2 style="margin-top:0">已收到，謝謝您 🙏</h2><p id="okText"></p>
    <div id="okSum"></div>
    <a class="btn full sec" id="statusLink" href="#" style="margin-top:14px">查看報價進度 ›</a></div>
  <p class="small">系統試算僅供參考，原則上以店家確認後的正式報價單為準。</p>
</main>
<script src="/pdc.js?v=20261019a"></script>
<script src="/regions.js?v=20261027g"></script>
<script src="/book.js?v=20261027g"></script>
<script src="/demo-banner.js"></script>
</body>
</html>
