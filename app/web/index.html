<title>店家營運中樞（示範）</title>

<body>
<div id="loginView" class="login" hidden>
  <div class="brand"><img class="wm" src="/brand-wordmark.png" alt="示範 示範服務店"><div class="nm">示範服務店</div><h1>登入營運中樞</h1><p>客服、帳務、服務人員都從這裡登入。</p></div>
  <form class="card" id="loginForm">
    <label for="lu">帳號</label><input id="lu" autocomplete="username" autocapitalize="off" required>
    <label for="lp">密碼</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn full" style="margin-top:20px" type="submit">登入</button>
    <div id="lerr" class="err" role="alert"></div>
    <div class="small" style="margin-top:14px">還沒有帳號、忘記密碼，請找示範服務店管理員開通或重設。</div>
  </form>
</div>
<div id="setpwView" class="login" hidden>
  <div class="brand"><img class="wm" src="/brand-wordmark.png" alt="示範 示範服務店"><div class="nm">示範服務店</div><h1>設定你自己的密碼</h1><p>第一次登入，換成只有你知道的密碼。</p></div>
  <form class="card" id="setpwForm">
    <label for="sp1">新密碼</label><input id="sp1" type="password" autocomplete="new-password" required>
    <label for="sp2">再輸入一次</label><input id="sp2" type="password" autocomplete="new-password" required>
    <button class="btn full" style="margin-top:20px" type="submit">設定並進入</button><div id="sperr" class="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
  <header class="topbar"><div class="in"><a class="brand" data-go="home"><img class="wm" src="/brand-wordmark.png" alt="示範">營運中樞</a>
    <nav id="gnav" aria-label="主要頁面"></nav><button class="helpbtn" id="helpbtn" title="這頁怎麼用" data-act="help">?</button><div class="user" id="gme" data-go="me"></div></div></header>
  <main class="main" id="main"></main>
  <footer class="foot"><b>示範服務店 · 營運中樞</b>　客戶、排班、派工、帳款都以這個系統為準。<br>官方 LINE 的派工卡、報價單、前一天提醒、完成照片由系統自動發送（可在「LINE 自動化」切換測試／正式）。</footer>
  <nav class="tabbar" id="tabbar" aria-label="分頁"></nav>
</div>
<div id="sheet" class="sheet" hidden><div class="pane" id="sheetBody" role="dialog" aria-modal="true"></div></div>
