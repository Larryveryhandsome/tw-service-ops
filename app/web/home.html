<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>示範服務店｜全台到府服務</title>
<meta name="description" content="示範服務店：臺北市到府一般到府服務、年度保養、進階專案、搬遷服務、店家與辦公室服務。官方 LINE 線上估價，正式報價單、服務前後照片、完工確認。">
<link rel="icon" href="/brand-favicon-64.png">
<link rel="stylesheet" href="/style.css?v=20261026a">
<style>
  :root { --brand: #6B5A4E; --cream: #FAF7F2; --ink: #1D1D1F; --sub: #6E6E73; --line: #06C755; }
  html, body { overflow-x: hidden; background: var(--cream); }
  .site { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 12px; flex-wrap: wrap; }
  .nav img { height: 28px; }
  .nav .bn { font-weight: 700; font-size: 18px; color: var(--ink); }
  .nav a.cta { white-space: nowrap; }
  .hero { padding: 48px 0 32px; }
  .hero h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.5px; }
  .hero p { font-size: 18px; color: var(--sub); max-width: 640px; margin: 0 0 24px; }
  .btn-line { display: inline-flex; align-items: center; gap: 8px; background: var(--line); color: #fff; border-radius: 999px; padding: 14px 22px; font-weight: 700; text-decoration: none; }
  .btn-ghost { display: inline-flex; align-items: center; border: 1.5px solid var(--brand); color: var(--brand); border-radius: 999px; padding: 12px 20px; font-weight: 600; text-decoration: none; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  section { margin-top: 44px; }
  section h2 { font-size: 26px; margin: 0 0 6px; }
  section > p.lead { color: var(--sub); margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .tile { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .tile h3 { margin: 0 0 6px; font-size: 18px; }
  .tile p { margin: 0; color: var(--sub); font-size: 15px; line-height: 1.6; }
  .soon { display: inline-block; font-size: 12px; background: #EFE9E1; color: var(--brand); border-radius: 999px; padding: 2px 10px; margin-left: 6px; vertical-align: middle; }
  .pt { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; background: #fff; border-radius: 18px; padding: 20px; }
  .pt div:nth-child(2n) { text-align: right; font-weight: 600; }
  .steps { counter-reset: s; display: grid; gap: 10px; }
  .steps div { background: #fff; border-radius: 14px; padding: 14px 16px 14px 52px; position: relative; }
  .steps div::before { counter-increment: s; content: counter(s); position: absolute; left: 16px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .quote { background: #fff; border-radius: 18px; padding: 18px 20px; }
  .quote p { margin: 0 0 8px; font-size: 16px; line-height: 1.6; }
  .quote small { color: var(--sub); }
  .card ul { margin: 6px 0 0; padding-left: 20px; } .card li { margin: 4px 0; color: var(--ink); }
  footer { margin-top: 56px; color: var(--sub); font-size: 14px; line-height: 1.8; border-top: 1px solid #E5E0D8; padding-top: 22px; }
  footer a { color: var(--brand); }
</style>
</head>
<body>
<div class="site" id="app"><p class="sub" style="padding:40px 0">載入中…</p></div>
<script src="/home.js?v=20261027a"></script>
<script src="/demo-banner.js"></script>
</body>
</html>
