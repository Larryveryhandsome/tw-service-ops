<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>報價單</title>
<link rel="icon" href="/brand-favicon-64.png">
<style>
:root{--ink:#1f1d1a;--sub:#6f6a63;--pill:#e4e1dc;--head:#8f8b85;--line:#dcd8d2;--green:#06C755;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.6 var(--sans);background:#f3f0eb;padding:24px 16px 60px}
.doc{position:relative;overflow:hidden;max-width:820px;margin:0 auto;border-radius:6px;padding:56px 56px 44px;
  background:radial-gradient(60% 40% at 100% 0%,#f1e6d6 0%,rgba(241,230,214,0) 70%),radial-gradient(50% 30% at 0% 100%,#efe7dc 0%,rgba(239,231,220,0) 70%),#faf8f5;
  box-shadow:0 10px 40px rgba(60,45,25,.10)}
.hd{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.brand img{height:62px;display:block}
.brand .zh{font:600 26px/1.3 var(--serif);letter-spacing:.42em;margin-top:14px}
.brand .en{font-size:12px;letter-spacing:.32em;color:#8b867f;margin-top:8px}
.ttl{border-left:1px solid var(--line);padding-left:40px}
.ttl .q{font-size:11px;letter-spacing:.5em;color:#c9c4bc}
.ttl h1{margin:6px 0 10px;font:700 58px/1 var(--serif);letter-spacing:.12em}
.ttl .s{font-size:11px;letter-spacing:.32em}
.pill{display:inline-block;background:var(--pill);border-radius:14px;padding:6px 20px;font:600 19px/1.4 var(--serif);letter-spacing:.2em}
.mid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin:40px 0 26px}
.kv{display:grid;grid-template-columns:96px 14px 1fr;row-gap:10px;margin:18px 0 0 18px;font-size:15px}.kv b{font-weight:500}.kv i{font-style:normal;color:#aaa}
.qno{background:var(--pill);border-radius:14px;padding:6px 16px;font-size:14px;white-space:nowrap}.qno span{letter-spacing:.12em;margin-left:14px;font-size:16px}
.dates{border-left:2px solid var(--line);margin:16px 0 0 34px;padding-left:16px;font-size:14px;line-height:2}.dates span{letter-spacing:.12em;margin-left:16px}
.tbl{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.55)}
.tr{display:grid;grid-template-columns:22% 1fr 26%}
.th{background:var(--head);color:#fff;font-size:17px;letter-spacing:.3em;text-align:center}
.th>div{padding:14px 8px}.th>div+div,.td>div+div{border-left:1px solid var(--line)}
.td{border-top:1px solid var(--line)}.td:first-of-type{border-top:0}
.td>div{padding:20px 18px;display:flex;flex-direction:column;justify-content:center}
.td .it{text-align:center;align-items:center;letter-spacing:.14em}.td .it small{display:block;font-size:13px;color:var(--sub);letter-spacing:.08em;margin-top:4px}
.td ol{margin:0;padding:0;list-style:none;counter-reset:n;font-size:14.5px;line-height:1.95}
.td ol li{counter-increment:n}.td ol li::before{content:counter(n,cjk-decimal) "";display:none}
.td .amt{align-items:center;letter-spacing:.18em;font-size:17px}
.foot{display:grid;grid-template-columns:1fr 330px;gap:24px;margin-top:22px}
.note{font-size:14px;letter-spacing:.06em;white-space:pre-wrap}
.sum div{display:grid;grid-template-columns:96px 1fr;margin-bottom:10px;border-radius:14px;overflow:hidden;font-size:16px}
.sum div span{background:var(--pill);padding:9px 18px;letter-spacing:.2em}.sum div span+span{background:#e9e6e1;text-align:center;letter-spacing:.16em;margin-left:3px}
.sum .t{font-size:22px;font-weight:700}.sum .t span{padding:11px 18px}
.pay{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-top:46px}
.pay .kv{grid-template-columns:auto 14px 1fr;margin-left:4px;font-size:16px}
.loc{display:flex;gap:16px;align-items:center}.loc svg{flex:none}
.loc b{display:block;font:600 26px/1.3 var(--serif);letter-spacing:.32em}.loc span{letter-spacing:.12em;font-size:14px}
.card{max-width:820px;margin:20px auto 0;background:#fff;border-radius:18px;padding:26px 24px;box-shadow:0 8px 30px rgba(60,45,25,.08)}
.card h2{margin:0 0 6px;font-size:21px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input#qtoolsNote,input#qhours,input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
canvas{width:100%;height:180px;border:1.5px dashed #C9BBA4;border-radius:14px;background:#fff;touch-action:none;display:block}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lnk{background:none;border:0;color:#8B6B4A;font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);margin-top:16px}.chk input{width:20px;height:20px;margin-top:1px;flex:none}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;background:var(--ink);color:#fff;font:600 17px/1 var(--sans);padding:16px;margin-top:18px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5}.btn.g{background:var(--green)}.btn.print{background:none;border:1px solid var(--line);color:var(--ink);font-size:14px;padding:10px;font-weight:500}
.err{color:#C62828;font-size:14px;margin-top:10px;min-height:1em}
.stamp{display:inline-block;border:2px solid #2E7D32;color:#2E7D32;border-radius:10px;padding:4px 12px;font-weight:700;transform:rotate(-3deg)}
.tsec{border-top:1px solid var(--line);padding:12px 0 4px}.tsec:first-of-type{border-top:0}.tsec h3{margin:6px 0;font-size:16px}
.tsec ol{margin:0;padding-left:20px;font-size:14px;line-height:1.75;color:var(--ink)}.tsec .chk{margin-top:8px;font-weight:600}
.sigrow{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.sig{max-width:240px;max-height:110px;border-bottom:1px solid var(--line)}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.prep{display:flex;gap:8px;align-items:center}.prep input{width:150px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.code{font-size:28px;letter-spacing:5px;text-align:center;background:#f3f0eb;border-radius:12px;padding:12px;font-weight:700}
.wait{text-align:center;padding:40px 24px}.wait .ic{font-size:44px}.wait h2{font:700 26px/1.4 var(--serif);letter-spacing:.1em;margin:10px 0}
@media (max-width:640px){
  body{padding:12px 10px 40px}.doc{padding:30px 20px}
  .hd{grid-template-columns:1fr;gap:18px}.ttl{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}.ttl h1{font-size:40px}
  .brand img{height:44px}.brand .zh{font-size:20px}
  .mid{grid-template-columns:1fr;margin:28px 0 20px}.dates{margin-left:0}.kv{margin-left:4px;grid-template-columns:80px 12px 1fr}
  .th{display:none}.tr{grid-template-columns:1fr}.td>div+div{border-left:0}.td>div{padding:10px 16px}.td .it{padding-top:18px;font-weight:600}
  .td .amt{padding-bottom:18px;align-items:flex-end}
  .foot{grid-template-columns:1fr}.pay{grid-template-columns:1fr}.loc b{font-size:20px}
}
@media print{.tr.td,.foot,.pay,.sum div{break-inside:avoid;page-break-inside:avoid}.th{break-after:avoid}body{background:#fff;padding:0}.doc{box-shadow:none;border-radius:0}.card,.noprint{display:none!important}}
</style>
</head>
<body>
<div id="msg" class="card" hidden></div>
<article class="doc" id="doc" hidden>
  <div class="hd">
    <div class="brand"><img src="/brand-wordmark.png" alt="示範" id="qlogo"><div class="zh" id="qzh">示範服務店</div><div class="en" id="qen">CLEANER SPACE, BRIGHTER LIFE</div></div>
    <div class="ttl"><div class="q">QUOTATION</div><h1>報價單</h1><div class="s">專業服務 · 讓空間回到最好的樣子</div></div>
  </div>
  <div class="mid">
    <div><span class="pill">客戶資訊</span><div class="kv" id="cust"></div></div>
    <div><div class="qno">報價單編號<span id="no"></span></div><div class="dates" id="dates"></div></div>
  </div>
  <div class="tbl"><div class="tr th"><div>項目</div><div>規格與範圍說明</div><div>項目費用</div></div><div id="items"></div></div>
  <div class="foot"><div class="note" id="note"></div><div class="sum" id="sum"></div></div>
  <div class="pay">
    <div><span class="pill">付款資訊</span><div class="kv" id="pay"></div></div>
    <div class="loc"><svg width="44" height="64" viewBox="0 0 44 64" aria-hidden="true"><path d="M22 2C11 2 2 11 2 22c0 15 20 40 20 40s20-25 20-40C42 11 33 2 22 2z" fill="#d9c7ae"/><circle cx="22" cy="21" r="8" fill="#fff"/></svg>
      <div><b id="qname">示範服務店</b><span id="addr"></span></div></div>
  </div>
  <div id="signed" hidden style="margin-top:26px"></div>
</article>
<section class="card" id="terms" hidden></section>
<section class="card" id="signbox" hidden>
  <h2>確認並簽收</h2>
  <p style="margin:0;color:var(--sub);font-size:14px">簽收後我們會開始幫您安排服務人員，人員確定後會用官方 LINE 通知您。</p>
  <label for="signer">簽收人姓名</label><input type="text" id="signer" autocomplete="name">
  <div class="row"><label style="margin-bottom:6px">請在框內簽名</label><button class="lnk" type="button" id="clr">清除重簽</button></div>
  <canvas id="pad"></canvas>
  <label class="chk"><input type="checkbox" id="agree"> 我已閱讀並同意本報價單內容與上方全部合約條款，並確認簽名為本人親簽。</label>
  <button class="btn" id="go" type="button">簽收報價單</button>
  <div class="err" id="err" role="alert"></div>
</section>
<section class="card" id="after" hidden>
  <h2>簽收完成，謝謝您 🙏</h2>
  <p style="color:var(--sub);font-size:14px;margin:4px 0 0">我們正在安排服務人員，確定後會通知您；服務前一天也會再提醒一次。</p>
  <div id="lineStep" hidden><p style="font-size:14px"><b>最後一步（1 秒）：</b>用 LINE 傳送下面的編號，之後通知都會直接傳到您的 LINE。</p>
    <div class="code" id="lineCode"></div><a class="btn g" id="lineGo" href="#">用 LINE 傳送編號</a></div>
</section>
<section class="card" id="paybox" hidden></section>
<div class="card noprint" style="padding:16px 24px" id="tools" hidden><button class="btn print" type="button" id="prt">列印／存成 PDF</button> <a class="btn print" id="pdfdl" href="#" target="_blank" rel="noopener" hidden>下載 PDF（可寄 Email）</a></div>
<script src="/draft.js?v=20261013a"></script>
<style>/* 錯誤訊息固定在畫面下方，看得到 */
#err:not(:empty){position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;margin:0;padding:14px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:16px;background:#FFF1F0;color:#B3261E;border:1px solid #F3B4AE}
.lq-bad{outline:3px solid #E5484D;outline-offset:4px;border-radius:12px}
</style>
<style>/* 付款區小按鈕、清除重簽，手機好按 */
.btn.sm{display:inline-block;width:auto;margin-top:0;padding:12px 16px;min-height:44px}
#clr{min-height:44px;padding:10px 14px;font-size:15px}
</style>
<script src="/lineqr.js?v=20261026a"></script>
<script src="/q.js?v=20261026a"></script>
<script src="/demo-banner.js"></script>
</body>
</html>
